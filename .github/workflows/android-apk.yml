name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true
      - name: Generate Android platform scaffolding if absent
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --org dev.pocketcloud --project-name pocketcloud .
          fi
      - name: Repository consistency checks
        run: python3 scripts/verify_source.py
      - name: Ensure manifest permissions and application settings
        run: python3 scripts/prepare_android_manifest.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          TURN_URL: ${{ vars.TURN_URL || secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME || vars.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL || vars.TURN_CREDENTIAL }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ.get('SUPABASE_PUBLISHABLE_KEY', '').strip()
          url = os.environ.get('SUPABASE_URL', '').strip()
          if not url or not key:
              sys.exit('Configure repository Actions Variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY before building a functional APK.')
          from urllib.parse import urlparse
          parsed = urlparse(url)
          host = (parsed.hostname or '').lower()
          if parsed.scheme != 'https' or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.port not in (None, 443) or parsed.path not in ('', '/') or len(host.split('.')) != 3 or not host.endswith('.supabase.co'):
              sys.exit('SUPABASE_URL must be a valid HTTPS <project-ref>.supabase.co URL with no extra path/query.')
          client_key = key.startswith('sb_publishable_') and len(key) > len('sb_publishable_')
          parts = key.split('.')
          if len(parts) == 3:
              try:
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + '=' * (-len(parts[1]) % 4)))
                  client_key = payload.get('role') == 'anon'
                  if payload.get('role') == 'service_role':
                      sys.exit('Refusing to embed a legacy service_role JWT in the APK.')
              except Exception:
                  pass
          if key.startswith('sb_secret_'):
              sys.exit('Refusing to embed a Supabase secret key in the APK.')
          if not client_key:
              sys.exit('Use an sb_publishable_ key or a legacy anon JWT. Do not embed service-role or secret keys.')
          PY
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define=TURN_URL="${TURN_URL}" \
            --dart-define=TURN_USERNAME="${TURN_USERNAME}" \
            --dart-define=TURN_CREDENTIAL="${TURN_CREDENTIAL}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketcloud-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
