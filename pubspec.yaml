name: pocketcloud
description: Turn an old Android phone into your personal cloud server.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.2
  flutter_webrtc: ^1.6.2+hotfix.4
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
